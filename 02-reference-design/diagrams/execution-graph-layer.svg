<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="3040" viewBox="0 0 1200 3040" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Execution Graph Layer</title>
  <desc id="diagram-desc">A selective, non-authoritative Reference Design representation of the Execution Graph Layer. Sources of organizational need may create a bounded Work Item, which may use an Execution Graph where useful. The graph represents explicit organizational execution rather than private reasoning, structures work around required Company Capabilities before assigning qualified Performers, preserves bounded Working Context, dependencies, sequence, parallel work, waiting, Decisions, Attention, status, failure, and recovery, and coordinates controlled progress toward an Outcome. The separate Organizational Control Plane independently enforces boundaries and exchanges declared trajectory and current restrictions with execution. Sufficient execution information remains reconstructible without claiming deterministic or identical results.</desc>
  <metadata><![CDATA[
    Diagram status: selective, non-authoritative Reference Design representation.
    Source: REFERENCE_DESIGN.md, especially The Operational Organization, Execution Graph Layer, Organizational Control Plane, Composition Relationships, Operational Flows, and Failure Modes.
    Architecture grounding: Operating Cycle, Controlled Execution, Decision Authority Accountability and Attention, and Organizational Continuity Incident and Recovery.
    The Execution Graph Layer represents organizational execution rather than private reasoning and is not a mandatory implementation for every Work Item.
  ]]></metadata>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#383838"/>
    </marker>
    <style><![CDATA[
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#222222}
