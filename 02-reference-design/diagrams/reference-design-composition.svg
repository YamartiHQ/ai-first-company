<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc">
  <title id="title">Reference Design Composition</title>
  <desc id="desc">Ten Reference Compositions are grouped by organizational responsibility: Executive Agent and Execution Graph Layer for Coordination; Company Brain and Organizational Learning for Intelligence; Capability Agent for Capability; Organizational Control Plane and Company Interface Layer for Control; Sandbox Organization and Production Organization for Environments; and Evaluation and Assurance for Assurance.</desc>
  <metadata><![CDATA[Non-authoritative Reference Design overview. Source: REFERENCE_DESIGN.md. Compositions are distinct organizational responsibilities, not ten required products, teams, services, or runtimes.]]></metadata>
  <style><![CDATA[
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#222}.title{font-size:34px;font-weight:700;letter-spacing:-.6px}.subtitle{font-size:19px;fill:#666}.region{fill:#f7f7f7;stroke:#b2b2b2;stroke-width:1.5}.card{fill:#fff;stroke:#b2b2b2;stroke-width:1.5}.kicker{font-size:15px;font-weight:700;letter-spacing:1px}.node-title{font-size:23px;font-weight:700;text-anchor:middle}.node-title-small{font-size:19px;font-weight:700;text-anchor:middle}.copy{font-size:16px;fill:#666;text-anchor:middle}.principle{font-size:19px;font-weight:700;text-anchor:middle}.principle-copy{font-size:16px;fill:#666;text-anchor:middle}
  ]]></style>
  <rect width="1200" height="1220" fill="#fff"/>
  <text class="title" x="48" y="54">Reference Design Composition</text>
  <text class="subtitle" x="48" y="84">Ten distinct organizational responsibilities—not ten required products or teams</text>

  <rect class="region" x="48" y="124" width="532" height="280" rx="24"/>
  <text class="kicker" x="76" y="162">COORDINATION</text>
  <rect class="card" x="76" y="190" width="230" height="170" rx="22"/>
  <text class="node-title" x="191" y="234">Executive Agent</text><text class="copy" x="191" y="272">General-purpose organizational</text><text class="copy" x="191" y="298">interface and coordination</text>
  <rect class="card" x="326" y="190" width="230" height="170" rx="22"/>
  <text class="node-title" x="441" y="230">Execution Graph</text><text class="node-title" x="441" y="258">Layer</text><text class="copy" x="441" y="296">Structured organizational</text><text class="copy" x="441" y="322">work and execution</text>

  <rect class="region" x="620" y="124" width="532" height="280" rx="24"/>
  <text class="kicker" x="648" y="162">INTELLIGENCE</text>
  <rect class="card" x="648" y="190" width="230" height="170" rx="22"/>
  <text class="node-title" x="763" y="234">Company Brain</text><text class="copy" x="763" y="272">Organization-owned</text><text class="copy" x="763" y="298">intelligence</text>
  <rect class="card" x="898" y="190" width="230" height="170" rx="22"/>
  <text class="node-title" x="1013" y="230">Organizational</text><text class="node-title" x="1013" y="258">Learning</text><text class="copy" x="1013" y="296">Reflection, candidates,</text><text class="copy" x="1013" y="322">and governed adoption</text>

  <rect class="region" x="48" y="440" width="532" height="280" rx="24"/>
  <text class="kicker" x="76" y="478">CAPABILITY</text>
  <rect class="card" x="76" y="506" width="476" height="170" rx="22"/>
  <text class="node-title" x="314" y="554">Capability Agent</text><text class="copy" x="314" y="594">Agent-based Capability Implementation</text><text class="copy" x="314" y="622">for a bounded organizational ability</text>

  <rect class="region" x="620" y="440" width="532" height="280" rx="24"/>
  <text class="kicker" x="648" y="478">CONTROL</text>
  <rect class="card" x="648" y="506" width="230" height="170" rx="22"/>
  <text class="node-title" x="763" y="546">Organizational</text><text class="node-title" x="763" y="574">Control Plane</text><text class="copy" x="763" y="612">Enforce Authority, Policy,</text><text class="copy" x="763" y="638">and Effect boundaries</text>
  <rect class="card" x="898" y="506" width="230" height="170" rx="22"/>
  <text class="node-title" x="1013" y="546">Company Interface</text><text class="node-title" x="1013" y="574">Layer</text><text class="copy" x="1013" y="612">Controlled external information</text><text class="copy" x="1013" y="638">and interaction</text>

  <rect class="region" x="48" y="756" width="532" height="280" rx="24"/>
  <text class="kicker" x="76" y="794">ENVIRONMENTS</text>
  <rect class="card" x="76" y="822" width="230" height="170" rx="22"/>
  <text class="node-title-small" x="191" y="866">Sandbox Organization</text><text class="copy" x="191" y="906">Evaluate candidate change</text><text class="copy" x="191" y="932">without Production effects</text>
  <rect class="card" x="326" y="822" width="230" height="170" rx="22"/>
  <text class="node-title-small" x="441" y="866">Production Organization</text><text class="copy" x="441" y="906">Operate real organizational</text><text class="copy" x="441" y="932">work and effects</text>

  <rect class="region" x="620" y="756" width="532" height="280" rx="24"/>
  <text class="kicker" x="648" y="794">ASSURANCE</text>
  <rect class="card" x="648" y="822" width="476" height="170" rx="22"/>
  <text class="node-title" x="886" y="870">Evaluation &amp; Assurance</text><text class="copy" x="886" y="910">Capability Qualification and continuous</text><text class="copy" x="886" y="936">operational assurance</text>

  <rect class="region" x="48" y="1086" width="1104" height="90" rx="22"/>
  <text class="principle" x="600" y="1124">Distinct responsibilities do not require distinct products, teams, or technical services.</text>
  <text class="principle-copy" x="600" y="1156">One implementation may support several Compositions while preserving each responsibility and boundary.</text>
</svg>
