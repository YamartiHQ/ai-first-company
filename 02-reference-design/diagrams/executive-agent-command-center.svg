<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2920" viewBox="0 0 1200 2920" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Executive Agent Command Center</title>
  <desc id="diagram-desc">A selective, non-authoritative Reference Design view of the Executive Agent as the primary actor-specific organizational command center. An authorized Human Actor enters through an isolated actor-specific session bounded by current governance. Organization-owned intelligence and State, current organizational operation, and governed internal and external systems supply Context Construction and a temporary bounded Working Context. The Executive Agent supports seeing, understanding and reviewing, coordinating, and authorized action initiation without becoming the Company Brain, a System of Record, an Authority owner, or an enforcement boundary. Material action leaves as an attributable Action Intent and follows Decision, Authority and Policy, Work Admission, Organizational Control Plane, Company Interface, External Effect, Outcome, and Evidence paths.</desc>
  <metadata><![CDATA[
    Diagram status: non-authoritative Reference Design representation.
    Source: REFERENCE_DESIGN.md, especially The Operational Organization, Executive Agent, Organizational Control Plane, Company Interface Layer, Composition Relationships, and Actor-Initiated Work.
    The diagram is selective rather than exhaustive and is not a mandatory implementation or universal routing topology.
    Presentation, technical reachability, conversation, and credentials grant neither Information Access nor organizational Authority.
    Working Context and Performer Memory remain distinct from the Company Brain; reusable improvement follows governed learning and adoption.
  ]]></metadata>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#383838"/>
    </marker>
    <style><![CDATA[
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#222222}
      .title{font-size:34px;font-weight:700;letter-spacing:-.6px}
      .subtitle{font-size:19px;fill:#666666}
      .region{fill:#f7f7f7;stroke:#b2b2b2;stroke-width:1.5}
      .card{fill:#ffffff;stroke:#b2b2b2;stroke-width:1.5}
      .focus{fill:#ffffff;stroke:#555555;stroke-width:2}
      .subordinate{fill:#f7f7f7;stroke:#b2b2b2;stroke-width:1.3}
      .kicker{font-size:15px;font-weight:700;letter-spacing:1px}
      .node-title{font-size:23px;font-weight:700;text-anchor:middle}
      .node-title-small{font-size:19px;font-weight:700;text-anchor:middle}
      .copy{font-size:16px;fill:#666666;text-anchor:middle}
      .copy-small{font-size:14px;fill:#666666;text-anchor:middle}
      .session-copy{font-size:13px;fill:#666666;text-anchor:middle}
      .function-title{font-size:18px;font-weight:700;letter-spacing:.8px;text-anchor:middle}
      .function-copy{font-size:15px;fill:#666666;text-anchor:middle}
      .label{font-size:14px;font-weight:700;fill:#666666;text-anchor:middle}
      .principle{font-size:18px;font-weight:700;text-anchor:middle}
      .principle-copy{font-size:15px;fill:#666666;text-anchor:middle}
      .note-title{font-size:18px;font-weight:700;text-anchor:middle}
      .note-copy{font-size:15px;fill:#666666;text-anchor:middle}
      .flow{fill:none;stroke:#383838;stroke-width:2.7;marker-end:url(#arrow)}
    ]]></style>
  </defs>

  <rect width="1200" height="2920" fill="#ffffff"/>
  <text class="title" x="48" y="54">Executive Agent Command Center</text>
  <text class="subtitle" x="48" y="84">The primary actor-specific Human–AI surface for governed organizational operation</text>

  <rect class="region" x="48" y="112" width="1104" height="82" rx="20"/>
  <text class="principle" x="600" y="145">Primary interface centrality—not mandatory organizational routing</text>
  <text class="principle-copy" x="600" y="172">Other authorized specialist and machine-oriented paths remain valid; the Executive Agent is primary, not exclusive.</text>

  <text class="kicker" x="48" y="238">ACTOR-SPECIFIC ENTRY AND CURRENT GOVERNANCE</text>

  <rect class="card" x="48" y="260" width="240" height="190" rx="22"/>
  <text class="kicker" x="76" y="296">IDENTIFIED ACTOR</text>
  <text class="node-title-small" x="168" y="344">Authorized Human Actor</text>
  <text class="copy" x="168" y="382">Identity remains distinct</text>
  <text class="copy" x="168" y="407">from session and interface</text>

  <rect class="focus" x="340" y="260" width="320" height="190" rx="22"/>
  <text class="kicker" x="368" y="296">ISOLATED ENTRY</text>
  <text class="node-title" x="500" y="337">Actor-Specific Session</text>
  <text class="session-copy" x="500" y="356">Different authorized views</text>
  <text class="session-copy" x="500" y="372">do not create a separate</text>
  <text class="session-copy" x="500" y="388">source of truth</text>
  <text class="session-copy" x="500" y="406">One logical Composition · isolated sessions</text>
  <text class="session-copy" x="500" y="424">AI Performers need not use</text>
  <text class="session-copy" x="500" y="440">the human visual interface</text>

  <rect class="subordinate" x="712" y="260" width="440" height="190" rx="22"/>
  <text class="kicker" x="740" y="296">GOVERNANCE BASIS</text>
  <text class="copy" x="932" y="328">Identity · Assignments · Information Access</text>
  <text class="copy" x="932" y="353">Decision Mandates · Authority · Policy</text>
  <text class="copy" x="932" y="378">Capability Qualification · Operational Confidence</text>
  <text class="copy" x="932" y="403">Work Admission where applicable</text>
  <text class="copy-small" x="932" y="430">Role labels and UI visibility create neither permission nor enforcement</text>

  <path class="flow" d="M288 355 H340"/>
  <path class="flow" d="M712 355 H660"/>

  <rect class="region" x="48" y="520" width="1104" height="340" rx="24"/>
  <text class="kicker" x="76" y="558">GOVERNED SOURCES AND CONTEXT CONSTRUCTION</text>

  <rect class="card" x="76" y="588" width="280" height="112" rx="20"/>
  <text class="node-title-small" x="216" y="625">Organization-Owned</text>
  <text class="node-title-small" x="216" y="648">Intelligence &amp; State</text>
  <text class="copy-small" x="216" y="676">Company Brain · Company State · records</text>

  <rect class="card" x="76" y="724" width="280" height="112" rx="20"/>
  <text class="node-title-small" x="216" y="761">Current Organizational</text>
  <text class="node-title-small" x="216" y="784">Operation</text>
  <text class="copy-small" x="216" y="812">Work · Decisions · Attention · Events</text>

  <rect class="focus" x="400" y="578" width="400" height="258" rx="24"/>
  <text class="kicker" x="600" y="616" text-anchor="middle">SELECT · RELATE · MINIMIZE · DELIVER</text>
  <text class="node-title" x="600" y="658">Context Construction</text>
  <text class="copy" x="600" y="696">Purpose · Scope · Authority</text>
  <text class="copy" x="600" y="722">Information Classification · Freshness</text>
  <text class="copy" x="600" y="748">Applicability · Uncertainty · Counter-Evidence</text>
  <line x1="432" y1="774" x2="768" y2="774" stroke="#dddddd" stroke-width="1.4"/>
  <text class="copy-small" x="600" y="802">Smallest sufficient context; missing or conflicting</text>
  <text class="copy-small" x="600" y="824">information remains visible</text>

  <rect class="card" x="844" y="588" width="280" height="248" rx="20"/>
  <text class="node-title-small" x="984" y="625">Governed Internal &amp;</text>
  <text class="node-title-small" x="984" y="648">External Systems</text>
  <text class="copy-small" x="984" y="682">Systems of Record · specialist interfaces</text>
  <text class="copy-small" x="984" y="706">embedded or connected applications</text>
  <text class="copy-small" x="984" y="730">external operational data</text>
  <line x1="876" y1="754" x2="1092" y2="754" stroke="#dddddd" stroke-width="1.4"/>
  <text class="copy-small" x="984" y="778">Source authority remains with</text>
  <text class="copy-small" x="984" y="800">the responsible System of Record;</text>
  <text class="copy-small" x="984" y="822">representations stay derived</text>

  <path class="flow" d="M500 450 V488 Q500 500 512 500 H588 Q600 500 600 512 V578"/>
  <path class="flow" d="M356 644 H400"/>
  <path class="flow" d="M356 780 H400"/>
  <path class="flow" d="M844 707 H800"/>

  <rect class="focus" x="390" y="916" width="420" height="142" rx="24"/>
  <text class="kicker" x="600" y="954" text-anchor="middle">TEMPORARY · PURPOSE-SPECIFIC · BOUNDED</text>
  <text class="node-title" x="600" y="995">Working Context</text>
  <text class="copy-small" x="600" y="1020">Not Company Brain · not permanent access</text>
  <text class="copy-small" x="600" y="1042">not an independent source of truth</text>
  <path class="flow" d="M600 836 V916"/>

  <rect class="region" x="48" y="1120" width="1104" height="540" rx="26"/>
  <text class="kicker" x="76" y="1158">EXECUTIVE AGENT COMPOSITION</text>
  <text class="node-title" x="600" y="1196">Executive Agent Command Center</text>
  <text class="copy" x="600" y="1225">Actor-specific, source-grounded observation, coordination, decision support, and action initiation</text>
  <path class="flow" d="M600 1058 V1120"/>

  <rect class="card" x="76" y="1262" width="500" height="160" rx="22"/>
  <text class="function-title" x="326" y="1301">SEE</text>
  <text class="function-copy" x="326" y="1335">current operation · Attention</text>
  <text class="function-copy" x="326" y="1360">Outcomes and Evidence</text>
  <text class="function-copy" x="326" y="1385">governed internal and external systems</text>

  <rect class="card" x="624" y="1262" width="500" height="160" rx="22"/>
  <text class="function-title" x="874" y="1301">UNDERSTAND &amp; REVIEW</text>
  <text class="function-copy" x="874" y="1335">source-grounded operating picture</text>
  <text class="function-copy" x="874" y="1360">Provenance · Freshness · Scope · Uncertainty</text>
  <text class="function-copy" x="874" y="1385">limitations and missing information</text>

  <rect class="card" x="76" y="1450" width="500" height="160" rx="22"/>
  <text class="function-title" x="326" y="1489">COORDINATE</text>
  <text class="function-copy" x="326" y="1523">Work and Capabilities · Decisions and reviews</text>
  <text class="function-copy" x="326" y="1548">incidents and handovers</text>
  <text class="function-copy" x="326" y="1573">responsible Actor or Performer · next required action</text>

  <rect class="card" x="624" y="1450" width="500" height="160" rx="22"/>
  <text class="function-title" x="874" y="1489">ACT</text>
  <text class="function-copy" x="874" y="1523">analyze · prepare proposals</text>
  <text class="function-copy" x="874" y="1548">decide where authorized · initiate authorized action</text>
  <text class="function-copy" x="874" y="1573">pause or restrict where authorized</text>

  <text class="principle-copy" x="600" y="1628">Command surface ≠ Company Brain ≠ System of Record ≠ Authority owner ≠ Accountability owner</text>
  <text class="principle-copy" x="600" y="1650">≠ Organizational Control Plane ≠ Company Interface Layer ≠ universal manager or router</text>

  <rect class="region" x="48" y="1710" width="1104" height="960" rx="26"/>
  <text class="kicker" x="76" y="1748">VIEWING, ANALYSIS, AND THE GOVERNED MATERIAL-ACTION PATH</text>

  <rect class="focus" x="76" y="1784" width="500" height="150" rx="22"/>
  <text class="note-title" x="326" y="1824">View / Explore / Analyze</text>
  <text class="note-copy" x="326" y="1858">does not by itself create Work, a Decision,</text>
  <text class="note-copy" x="326" y="1882">or an External Effect.</text>
  <text class="note-copy" x="326" y="1910">Analysis may instead produce a proposal or proposed Work.</text>

  <rect class="subordinate" x="76" y="1964" width="500" height="142" rx="22"/>
  <text class="note-title" x="326" y="2002">Permission and enforcement stay outside</text>
  <text class="note-copy" x="326" y="2035">The Executive Agent initiates and presents the path.</text>
  <text class="note-copy" x="326" y="2060">It grants no permission; every material action is re-evaluated.</text>
  <text class="note-copy" x="326" y="2085">UI visibility is not the enforcement boundary.</text>

  <rect class="subordinate" x="76" y="2136" width="500" height="166" rx="22"/>
  <text class="note-title" x="326" y="2174">Governed external interaction</text>
  <text class="note-copy" x="326" y="2207">Technical credentials and reachability create no Authority.</text>
  <text class="note-copy" x="326" y="2232">Direct interaction requires demonstrably equivalent controls.</text>
  <text class="note-copy" x="326" y="2257">Retrospective recording does not cure missing prior</text>
  <text class="note-copy" x="326" y="2282">Authority, Decision, Work Admission, or control.</text>

  <rect class="subordinate" x="76" y="2332" width="500" height="182" rx="22"/>
  <text class="note-title" x="326" y="2370">Representation and ownership boundary</text>
  <text class="note-copy" x="326" y="2403">Live values, filtered views, reports, caches, searches,</text>
  <text class="note-copy" x="326" y="2428">summaries, and analyses remain attributable representations.</text>
  <text class="note-copy" x="326" y="2453">Presentation silently copies neither all external information</text>
  <text class="note-copy" x="326" y="2478">into the Company Brain nor Authority into the interface.</text>

  <text class="kicker" x="900" y="1778" text-anchor="middle">GOVERNED MATERIAL ACTION</text>

  <rect class="card" x="700" y="1800" width="400" height="88" rx="20"/>
  <text class="node-title-small" x="900" y="1836">Attributable Action Intent</text>
  <text class="copy-small" x="900" y="1864">The Executive Agent initiates; it does not authorize</text>
  <path class="flow" d="M1060 1610 V1800"/>

  <rect class="card" x="700" y="1912" width="400" height="88" rx="20"/>
  <text class="node-title-small" x="900" y="1948">Decision where required</text>
  <text class="copy-small" x="900" y="1976">Proposal ≠ Decision</text>
  <path class="flow" d="M900 1888 V1912"/>

  <rect class="card" x="700" y="2024" width="400" height="88" rx="20"/>
  <text class="node-title-small" x="900" y="2060">Applicable Authority &amp; Policy</text>
  <text class="copy-small" x="900" y="2088">Current bounded permission and governing constraints</text>
  <path class="flow" d="M900 2000 V2024"/>

  <rect class="card" x="700" y="2136" width="400" height="88" rx="20"/>
  <text class="node-title-small" x="900" y="2172">Work Admission</text>
  <text class="copy-small" x="900" y="2200">Readiness · dependencies · capacity · case consistency</text>
  <path class="flow" d="M900 2112 V2136"/>

  <rect class="card" x="700" y="2248" width="400" height="88" rx="20"/>
  <text class="node-title-small" x="900" y="2284">Organizational Control Plane</text>
  <text class="copy-small" x="900" y="2312">Performer-independent per-action enforcement</text>
  <path class="flow" d="M900 2224 V2248"/>

  <rect class="card" x="700" y="2360" width="400" height="88" rx="20"/>
  <text class="node-title-small" x="900" y="2396">Company Interface Layer</text>
  <text class="copy-small" x="900" y="2424">Where external interaction is applicable</text>
  <path class="flow" d="M900 2336 V2360"/>

  <rect class="card" x="700" y="2472" width="400" height="88" rx="20"/>
  <text class="node-title-small" x="900" y="2508">External Interaction</text>
  <text class="copy-small" x="900" y="2536">May produce a distinct governed External Effect</text>
  <path class="flow" d="M900 2448 V2472"/>

  <rect class="card" x="700" y="2584" width="400" height="64" rx="20"/>
  <text class="node-title-small" x="900" y="2612">Outcome &amp; Evidence</text>
  <text class="copy-small" x="900" y="2636">Return to organization-owned governed records</text>
  <path class="flow" d="M900 2560 V2584"/>

  <rect class="region" x="48" y="2720" width="1104" height="152" rx="22"/>
  <text class="principle" x="600" y="2756">The Executive Agent is reconstructible from organization-owned State, governed configuration, and permitted memory.</text>
  <text class="principle-copy" x="600" y="2790">Private conversation and drafts remain non-authoritative; Working Context and Performer Memory do not become a second Company Brain.</text>
  <text class="principle-copy" x="600" y="2818">Reusable improvements become organizational assets only through normal Reflection, governed Adoption, evaluation, qualification, and deployment.</text>
  <text class="principle-copy" x="600" y="2846">No relationship silently transfers Responsibility, Authority, Accountability, or Information Access.</text>
</svg>
