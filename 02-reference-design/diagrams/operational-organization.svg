  <path class="flow" d="M180 800 V1118 Q180 1130 192 1130 H340"/>
  <text class="label-small" x="205" y="930" style="text-anchor:start">
    <tspan x="205">explicit work</tspan>
    <tspan x="205" dy="18">and trajectory</tspan>
  </text>

  <path class="flow" d="M600 1000 V1070"/>
  <text class="label-small" x="705" y="1041">intended work and effects</text>
  <path class="flow" d="M600 1190 V1240"/>
