  <text class="node-title-small" x="940" y="1675">Evaluation &amp; Assurance</text>
  <text class="copy" x="940" y="1707">Evidence · confidence · governed response</text>

  <path class="flow" d="M900 1350 V1556 Q900 1568 888 1568 H272 Q260 1568 260 1580 V1600"/>
  <text class="label-small" x="260" y="1532">
    <tspan x="260">optional controlled</tspan>
    <tspan x="260" dy="18">derived information</tspan>
  </text>

  <path class="flow" d="M460 1642 H740"/>
  <path class="flow" d="M740 1692 H460"/>
  <text class="label-small" x="600" y="1630">candidate Evidence</text>
  <text class="label-small" x="600" y="1718">evaluation scope and findings</text>

  <path class="flow" d="M950 1350 V1600"/>
  <path class="flow" d="M1010 1600 V1350"/>
  <text class="label-small" x="970" y="1482" transform="rotate(-90 970 1482)">Production Evidence</text>
  <text class="label-small" x="1042" y="1468" style="text-anchor:start">Operational Confidence</text>
  <text class="label-small" x="1042" y="1488" style="text-anchor:start">applicable Authority</text>
  <text class="label-small" x="1042" y="1508" style="text-anchor:start">response</text>

  <rect class="region" x="48" y="1760" width="1104" height="60" rx="20"/>
  <text class="principle" x="600" y="1787">Connected operation does not collapse distinct responsibilities.</text>
  <text class="principle-copy" x="600" y="1810">Learning requires governed adoption. Evidence informs confidence and review; it does not create Authority.</text>
</svg>
