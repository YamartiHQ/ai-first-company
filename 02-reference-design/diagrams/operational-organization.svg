  <text class="node-title" x="600" y="1119">Organizational Control Plane</text>
  <text class="copy" x="600" y="1150">Performer-independent enforcement of</text>
  <text class="copy" x="600" y="1174">Authority, Policy, Scope, and Effects</text>

  <rect class="card" x="340" y="1240" width="520" height="120" rx="22"/>
  <text class="node-title" x="600" y="1289">Company Interface Layer</text>
  <text class="copy" x="600" y="1323">Attributable permitted inbound and outbound interaction</text>

  <rect class="output" x="880" y="1240" width="240" height="110" rx="18"/>
  <text class="output-title" x="1000" y="1279">PRODUCTION OPERATION</text>
  <text class="copy" x="1000" y="1310">Outcomes · Evidence</text>
  <text class="copy" x="1000" y="1333">Experience</text>

  <path class="flow" d="M420 320 V480"/>
  <path class="flow" d="M470 480 V320"/>
  <text class="label" x="540" y="352">interaction</text>

  <path class="flow" d="M360 270 H74 Q62 270 62 282 V728 Q62 740 74 740 H120"/>
  <text class="label-small" x="38" y="512" transform="rotate(-90 38 512)">other authorized path</text>

  <path class="flow" d="M500 510 H700"/>
  <path class="flow" d="M700 570 H500"/>
  <text class="label-small" x="600" y="498">attributable interaction</text>
  <text class="label-small" x="600" y="544">organization-owned</text>
  <text class="label-small" x="600" y="560">intelligence</text>

  <path class="flow" d="M240 590 V680"/>
  <path class="flow" d="M380 680 V590"/>
