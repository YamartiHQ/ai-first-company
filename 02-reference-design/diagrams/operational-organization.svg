  <text class="node-title" x="310" y="729">Execution Graph Layer</text>
  <text class="copy" x="310" y="763">Explicit structured organizational work</text>

  <rect class="card" x="700" y="680" width="380" height="120" rx="22"/>
  <text class="node-title" x="890" y="729">Organizational Learning</text>
  <text class="copy" x="890" y="760">Reflection · candidates · governed adoption</text>
  <text class="copy" x="890" y="783">No automatic change to operation</text>

  <text class="kicker" x="600" y="858" style="text-anchor:middle">CAPABILITY REALIZATION</text>
  <rect class="card" x="340" y="880" width="520" height="120" rx="22"/>
  <text class="node-title" x="600" y="929">Capability Agent</text>
  <text class="copy" x="600" y="963">Qualified agent-based Capability Implementation</text>

