  <text class="kicker" x="408" y="1454">EXTERNAL ENVIRONMENT</text>
  <text class="node-title" x="600" y="1491">External World</text>
  <path class="flow" d="M560 1360 V1420"/>
  <path class="flow" d="M640 1420 V1360"/>
  <text class="label-small" x="470" y="1384">outbound interaction</text>
  <text class="label-small" x="730" y="1384">attributable input</text>

  <rect class="card" x="60" y="1600" width="400" height="130" rx="22"/>
  <text class="kicker-lower" x="260" y="1636">ISOLATED CANDIDATE EVALUATION</text>
  <text class="node-title-small" x="260" y="1675">Sandbox Organization</text>
  <text class="copy" x="260" y="1707">No Production effects or state transfer</text>

  <rect class="card" x="740" y="1600" width="400" height="130" rx="22"/>
