<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1840" viewBox="0 0 1200 1840" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Operational Organization</title>
  <desc id="diagram-desc">A selective, non-authoritative map of principal relationships among the ten AI-First Company Reference Design Compositions. Actors and Organizational Needs interact through the Executive Agent or other authorized paths. Coordination and organization-owned intelligence connect to structured work, Capability Agents, externally enforced control, attributable external interaction, Production operation, Sandbox evaluation, Evaluation and Assurance, and governed Organizational Learning. The map is neither a hierarchy nor a mandatory technical call path.</desc>
  <metadata><![CDATA[
    Diagram status: non-authoritative Reference Design representation.
    Source: REFERENCE_DESIGN.md, especially Composition Overview, The Operational Organization, Composition Relationships, and Operational Flows.
    The diagram is selective rather than exhaustive and shows principal relationships rather than hierarchy or a mandatory call path.
    Relationships transfer neither Responsibility, Authority, Accountability, nor Information Access automatically.
  ]]></metadata>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#383838"/>
    </marker>
    <style><![CDATA[
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#222222}
      .title{font-size:34px;font-weight:700;letter-spacing:-.6px}
      .subtitle{font-size:19px;fill:#666666}
      .region{fill:#f7f7f7;stroke:#b2b2b2;stroke-width:1.5}
      .card{fill:#ffffff;stroke:#b2b2b2;stroke-width:1.5}
      .focus{fill:#ffffff;stroke:#555555;stroke-width:2}
      .kicker{font-size:15px;font-weight:700;letter-spacing:1px}
      .kicker-lower{font-size:14px;font-weight:700;letter-spacing:.8px;text-anchor:middle}
      .node-title{font-size:23px;font-weight:700;text-anchor:middle}
      .node-title-small{font-size:20px;font-weight:700;text-anchor:middle}
      .copy{font-size:16px;fill:#666666;text-anchor:middle}
      .region-copy{font-size:16px;font-weight:600;fill:#555555;text-anchor:end}
      .container-title{font-size:18px;font-weight:700;letter-spacing:1px}
      .container-context{font-size:13px;font-weight:700;letter-spacing:.7px;text-anchor:end}
      .container-detail{font-weight:600;letter-spacing:0;fill:#555555}
      .output{fill:#f7f7f7;stroke:#b2b2b2;stroke-width:1.2}
      .output-title{font-size:14px;font-weight:700;letter-spacing:.8px;text-anchor:middle}
      .label{font-size:14px;font-weight:700;fill:#666666;text-anchor:middle}
      .label-small{font-size:13px;font-weight:700;fill:#666666;text-anchor:middle}
      .principle{font-size:18px;font-weight:700;text-anchor:middle}
      .principle-copy{font-size:15px;fill:#666666;text-anchor:middle}
      .flow{fill:none;stroke:#383838;stroke-width:2.7;marker-end:url(#arrow)}
    ]]></style>
  </defs>

  <rect width="1200" height="1840" fill="#ffffff"/>
  <text class="title" x="48" y="54">Operational Organization</text>
  <text class="subtitle" x="48" y="84">How the ten Reference Compositions connect during organizational operation</text>

  <rect class="region" x="48" y="112" width="1104" height="76" rx="20"/>
  <text class="principle" x="600" y="143">Principal relationships, not hierarchy or a mandatory technical call path</text>
  <text class="principle-copy" x="600" y="169">Other authorized paths remain valid; relationships transfer no Authority, Accountability, or Information Access.</text>

  <rect class="card" x="360" y="220" width="480" height="100" rx="22"/>
  <text class="kicker" x="388" y="254">ORGANIZATIONAL ENTRY</text>
  <text class="node-title" x="600" y="289">Actors / Organizational Needs</text>

  <rect class="region" x="88" y="370" width="1064" height="1020" rx="26"/>
  <text class="container-title" x="108" y="410">PRODUCTION ORGANIZATION</text>
  <text class="container-context" x="1124" y="410">CURRENT OPERATIONAL REALITY<tspan class="container-detail"> · Real work · Outcomes · Evidence · Experience</tspan></text>

  <text class="kicker" x="310" y="460" style="text-anchor:middle">COORDINATION</text>
  <rect class="focus" x="120" y="480" width="380" height="110" rx="22"/>
  <text class="node-title" x="310" y="523">Executive Agent</text>
  <text class="copy" x="310" y="557">Actor-specific understanding and coordination</text>

  <text class="kicker" x="890" y="460" style="text-anchor:middle">ORGANIZATION-OWNED INTELLIGENCE</text>
  <rect class="card" x="700" y="480" width="380" height="110" rx="22"/>
  <text class="node-title" x="890" y="523">Company Brain</text>
  <text class="copy" x="890" y="557">Governed organizational intelligence</text>

