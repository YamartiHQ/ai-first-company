<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
  <title id="title">Organizational Evolution</title>
  <desc id="desc">Organizational Learning and Implementation Evolution are distinct governed paths. Learning connects Experience, Organizational Reflection, a Learning Candidate, Evidence and Validation, governed Adoption, and appropriate organizational intelligence or practice. Implementation Evolution connects a Candidate Implementation Change, Sandbox Organization, Evaluation and Assurance, Capability Qualification, governed Adoption, and Production Organization. Production Experience may flow to Experience and Organizational Learning; Production Evidence may flow separately to Evaluation and Assurance; optional controlled Production-derived information may flow separately to Sandbox.</desc>
  <metadata><![CDATA[Non-authoritative Reference Design overview. Source: REFERENCE_DESIGN.md. A qualified change—not Sandbox state—moves to Production. Learning does not automatically change Production. Qualification does not create Authority.]]></metadata>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#383838"/></marker>
    <style><![CDATA[
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#222}.title{font-size:34px;font-weight:700;letter-spacing:-.6px}.subtitle{font-size:19px;fill:#666}.region{fill:#f7f7f7;stroke:#b2b2b2;stroke-width:1.5}.card{fill:#fff;stroke:#b2b2b2;stroke-width:1.5}.kicker{font-size:15px;font-weight:700;letter-spacing:1px}.node-title{font-size:23px;font-weight:700;text-anchor:middle}.node-title-small{font-size:21px;font-weight:700;text-anchor:middle}.copy{font-size:16px;fill:#666;text-anchor:middle}.flow{fill:none;stroke:#383838;stroke-width:2.7;marker-end:url(#arrow)}.optional{fill:none;stroke:#383838;stroke-width:2.7;marker-end:url(#arrow)}.label{font-size:15px;font-weight:700;fill:#666;text-anchor:middle}.principle{font-size:19px;font-weight:700;text-anchor:middle}.principle-copy{font-size:16px;fill:#666;text-anchor:middle}
    ]]></style>
  </defs>
  <rect width="1200" height="1280" fill="#fff"/>
  <text class="title" x="48" y="54">Organizational Evolution</text>
  <text class="subtitle" x="48" y="84">The organization may learn continuously while changing deliberately</text>

  <rect class="region" x="48" y="124" width="532" height="916" rx="24"/>
  <text class="kicker" x="76" y="164">A · ORGANIZATIONAL LEARNING</text>
  <rect class="card" x="104" y="190" width="420" height="104" rx="22"/>
  <text class="node-title" x="314" y="232">Experience</text><text class="copy" x="314" y="266">Human, AI, team, system, or Outcome-derived</text>
  <rect class="card" x="104" y="334" width="420" height="104" rx="22"/>
  <text class="node-title" x="314" y="376">Organizational Reflection</text><text class="copy" x="314" y="410">Governed examination of Experience</text>
  <rect class="card" x="104" y="478" width="420" height="104" rx="22"/>
  <text class="node-title" x="314" y="520">Learning Candidate</text><text class="copy" x="314" y="554">Proposed reusable insight or change</text>
  <rect class="card" x="104" y="622" width="420" height="104" rx="22"/>
  <text class="node-title" x="314" y="664">Evidence &amp; Validation</text><text class="copy" x="314" y="698">Support, challenge, or reject the candidate</text>
  <rect class="card" x="104" y="766" width="420" height="104" rx="22"/>
  <text class="kicker" x="132" y="800">GOVERNED</text><text class="node-title" x="314" y="828">Adoption</text>
  <rect class="card" x="104" y="910" width="420" height="104" rx="22"/>
  <text class="node-title-small" x="314" y="950" style="font-size:19px">Company Brain / Organizational Practice</text><text class="copy" x="314" y="984">Appropriately adopted organizational intelligence</text>
  <path class="flow" d="M314 294 V334"/><path class="flow" d="M314 438 V478"/><path class="flow" d="M314 582 V622"/><path class="flow" d="M314 726 V766"/><path class="flow" d="M314 870 V910"/>

  <rect class="region" x="620" y="124" width="532" height="916" rx="24"/>
  <text class="kicker" x="648" y="164">B · IMPLEMENTATION EVOLUTION</text>
  <rect class="card" x="660" y="190" width="392" height="104" rx="22"/>
  <text class="node-title-small" x="856" y="220">Candidate Implementation</text><text class="node-title-small" x="856" y="244">Change</text><text class="copy" x="856" y="276">Bounded implementation or configuration change</text>
  <rect class="card" x="660" y="334" width="392" height="104" rx="22"/>
  <text class="node-title" x="856" y="376">Sandbox Organization</text><text class="copy" x="856" y="410">Evaluate without Production effects</text>
  <rect class="card" x="660" y="478" width="392" height="104" rx="22"/>
  <text class="node-title" x="856" y="520">Evaluation &amp; Assurance</text><text class="copy" x="856" y="554">Determine Evidence and bounded limits</text>
  <rect class="card" x="660" y="622" width="392" height="104" rx="22"/>
  <text class="node-title" x="856" y="664">Capability Qualification</text><text class="copy" x="856" y="698">Demonstrated capability in Scope</text>
  <rect class="card" x="660" y="766" width="392" height="104" rx="22"/>
  <text class="kicker" x="688" y="800">GOVERNED</text><text class="node-title" x="856" y="828">Adoption</text>
  <rect class="card" x="660" y="910" width="392" height="104" rx="22"/>
  <text class="node-title" x="856" y="952">Production Organization</text><text class="copy" x="856" y="986">Operate qualified adopted change</text>
  <path class="flow" d="M856 294 V334"/><path class="flow" d="M856 438 V478"/><path class="flow" d="M856 582 V622"/><path class="flow" d="M856 726 V766"/><path class="flow" d="M856 870 V910"/>

  <path class="optional" d="M1052 986 H1108 Q1120 986 1120 974 V398 Q1120 386 1108 386 H1052"/>
  <text class="label" x="1140" y="686" transform="rotate(-90 1140 686)">optional controlled Production-derived information</text>
  <path class="flow" d="M1052 938 H1064 Q1076 938 1076 926 V542 Q1076 530 1064 530 H1052"/>
  <text class="label" x="1096" y="734" transform="rotate(-90 1096 734)">Production Evidence</text>
  <path class="optional" d="M660 942 H648 Q636 942 636 930 V254 Q636 242 624 242 H524"/>
  <text class="label" x="616" y="597" transform="rotate(-90 616 597)">Production Experience</text>

  <rect class="region" x="48" y="1090" width="1104" height="142" rx="22"/>
  <text class="principle" x="600" y="1128">A qualified change moves to Production—not the Sandbox state.</text>
  <text class="principle-copy" x="600" y="1162">Learning does not automatically change Production.</text>
  <text class="principle-copy" x="600" y="1192">Qualification demonstrates capability; it does not create Authority.</text>
</svg>
