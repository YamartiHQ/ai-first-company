<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">From Observation to Accountable Action</title>
  <desc id="desc">Continuous Environmental Intelligence observes the External World and produces Evidence from significant observations. A supported proposal is evaluated for Impact and Urgency, assigned a Response Class, routed to a Decision Mandate, and may proceed to Intent only after an accountable authorization decision.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#383838"/></marker>
    <marker id="arrow-secondary" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#383838"/></marker>
    <style><![CDATA[
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#222222}.title{font-size:34px;font-weight:700;letter-spacing:-.6px}.subtitle{font-size:19px;fill:#666666}.kicker{font-size:14px;font-weight:700;letter-spacing:.8px}.node-title{font-size:23px;font-weight:700}.node-copy{font-size:16px;fill:#666666}.label{font-size:15px;font-weight:700;text-anchor:middle;fill:#666666}.dimension{font-size:18px;font-weight:700;text-anchor:middle}.class{font-size:15px;font-weight:700;text-anchor:middle}.principle{font-size:20px;font-weight:700;text-anchor:middle;fill:#222222}.principle-copy{font-size:16px;text-anchor:middle;fill:#222222}.flow{fill:none;stroke:#383838;stroke-width:2.7;marker-end:url(#arrow)}.governance{fill:none;stroke:#383838;stroke-width:2.7;marker-end:url(#arrow-secondary)}rect{fill:#f7f7f7!important;stroke:#b2b2b2!important}rect[fill="#fff"],rect[fill="#ffffff"]{fill:#fff!important}svg>rect:first-of-type{fill:#fff!important;stroke:none!important}text{fill:#222!important}.subtitle,.node-copy,.principle-copy{fill:#666!important}.flow,.governance{stroke:#383838!important}marker path{fill:#383838!important}
    ]]></style>
  </defs>
  <rect width="1200" height="850" fill="#fff" stroke-width="1.5"/>
  <text class="title" x="48" y="54">From Observation to Accountable Action</text>
  <text class="subtitle" x="48" y="84">Observation creates visibility. Evaluation creates priority. Accountable governance creates authority.</text>

  <rect x="48" y="150" width="280" height="140" rx="22" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="kicker" x="76" y="184" fill="#666666">SOURCE</text><text class="node-title" x="188" y="220" text-anchor="middle">External World</text><text class="node-copy" x="76" y="252">Relevant external conditions</text><text class="node-copy" x="76" y="274">and change</text>
  <rect x="460" y="150" width="280" height="140" rx="22" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="kicker" x="488" y="180" fill="#222222">OBSERVE</text><text class="node-title" x="600" y="208" text-anchor="middle">Environmental</text><text class="node-title" x="600" y="232" text-anchor="middle">Intelligence</text><text class="node-copy" x="488" y="258">Evaluates relevance and</text><text class="node-copy" x="488" y="280">produces attributable Evidence</text>
  <rect x="872" y="150" width="280" height="140" rx="22" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="kicker" x="900" y="184" fill="#222222">VISIBLE</text><text class="node-title" x="1012" y="220" text-anchor="middle">Evidence</text><text class="node-copy" x="900" y="252">Significant observation</text><text class="node-copy" x="900" y="274">retained with attribution</text>
  <path class="flow" fill="none" stroke="#383838" stroke-width="2.7" marker-end="url(#arrow)" d="M328 220 H450"/><path class="flow" fill="none" stroke="#383838" stroke-width="2.7" marker-end="url(#arrow)" d="M740 220 H862"/>

  <rect x="48" y="390" width="520" height="230" rx="24" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="kicker" x="76" y="426" fill="#222222">SUPPORTED PROPOSAL</text><text class="node-title" x="308" y="464" text-anchor="middle">Proposal Evaluation</text>
  <rect x="76" y="490" width="190" height="56" rx="18" fill="#fff" stroke="#b2b2b2" stroke-width="1.5"/><text class="dimension" x="171" y="525">Impact</text>
  <rect x="286" y="490" width="190" height="56" rx="18" fill="#fff" stroke="#b2b2b2" stroke-width="1.5"/><text class="dimension" x="381" y="525">Urgency</text>
  <text class="node-copy" x="76" y="582">Evaluate independently before assigning a Response Class.</text>
  <path class="flow" fill="none" stroke="#383838" stroke-width="2.7" marker-end="url(#arrow)" d="M1012 290 V330 Q1012 350 992 350 H308 Q288 350 288 370 V390"/><text class="label" x="650" y="338">may support a proposal</text>

  <rect x="632" y="390" width="520" height="230" rx="24" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="kicker" x="660" y="426" fill="#222222">PRIORITIZE</text><text class="node-title" x="892" y="464" text-anchor="middle">Response Class</text>
  <rect x="660" y="490" width="78" height="48" rx="16" fill="#fff" stroke="#b2b2b2" stroke-width="1.5"/><text class="class" x="699" y="520">P0</text>
  <rect x="754" y="490" width="78" height="48" rx="16" fill="#fff" stroke="#b2b2b2" stroke-width="1.5"/><text class="class" x="793" y="520">P1</text>
  <rect x="848" y="490" width="78" height="48" rx="16" fill="#fff" stroke="#b2b2b2" stroke-width="1.5"/><text class="class" x="887" y="520">P2</text>
  <rect x="942" y="490" width="78" height="48" rx="16" fill="#fff" stroke="#b2b2b2" stroke-width="1.5"/><text class="class" x="981" y="520">P3</text>
  <rect x="1036" y="490" width="78" height="48" rx="16" fill="#fff" stroke="#b2b2b2" stroke-width="1.5"/><text class="class" x="1075" y="520">P4</text>
  <text class="node-copy" x="660" y="582">Immediate · Required · Recommended · Observe · Closed</text>
  <path class="flow" fill="none" stroke="#383838" stroke-width="2.7" marker-end="url(#arrow)" d="M568 505 H622"/>

  <rect x="48" y="690" width="300" height="100" rx="22" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="node-title" x="198" y="730" text-anchor="middle">Decision Mandate</text><text class="node-copy" x="76" y="760">Accountable human authority</text>
  <rect x="450" y="690" width="300" height="100" rx="22" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="node-title" x="600" y="730" text-anchor="middle">Authorization Decision</text><text class="node-copy" x="478" y="760">Approve, constrain, defer, or reject</text>
  <rect x="852" y="690" width="300" height="100" rx="22" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="node-title" x="1002" y="730" text-anchor="middle">Intent Generation</text><text class="node-copy" x="880" y="760">May create explicit Intent</text>
  <path class="governance" fill="none" stroke="#383838" stroke-width="2.7" marker-end="url(#arrow-secondary)" d="M892 620 V640 Q892 660 872 660 H208 Q188 660 188 670 V680"/><text class="label" x="535" y="648" fill="#222222">routes proposal</text>
  <path class="governance" fill="none" stroke="#383838" stroke-width="2.7" marker-end="url(#arrow-secondary)" d="M348 740 H440"/><path class="governance" fill="none" stroke="#383838" stroke-width="2.7" marker-end="url(#arrow-secondary)" d="M750 740 H842"/>
  <text x="1152" y="834" text-anchor="end" font-size="12" fill="#666666">Priority supports decision making · priority alone never authorizes execution</text>
</svg>
