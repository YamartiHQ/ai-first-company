<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Context Sources and Working Context</title>
  <desc id="desc">Knowledge Access selects authorized information from Company Memory, Company State, Systems of Record, current activity, and governance to prepare the smallest sufficient Working Context for one activity.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#383838"/></marker>
    <marker id="constraint" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#383838"/></marker>
    <style><![CDATA[
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#222222}.title{font-size:34px;font-weight:700;letter-spacing:-.6px}.subtitle{font-size:19px;fill:#666666}.node-title{font-size:23px;font-weight:700}.node-copy{font-size:17px;fill:#666666}.process{font-size:16px;font-weight:700;text-anchor:middle;fill:#666666}.label{font-size:15px;font-weight:700;text-anchor:middle;fill:#666666}.note-title{font-size:19px;font-weight:700}.note{font-size:16px;fill:#222222}.flow{fill:none;stroke:#383838;stroke-width:2.7;marker-end:url(#arrow)}.constraint{fill:none;stroke:#383838;stroke-width:2.3;stroke-dasharray:5 5;marker-end:url(#constraint)}rect{fill:#f7f7f7!important;stroke:#b2b2b2!important}rect[fill="#fff"],rect[fill="#ffffff"]{fill:#fff!important}svg>rect:first-of-type{fill:#fff!important;stroke:none!important}.label-bg{fill:#fff!important;stroke:none!important}text{fill:#222!important}.subtitle,.node-copy,.note{fill:#666!important}line{stroke:#ddd!important}.flow,.constraint{stroke:#383838!important}marker path{fill:#383838!important}
    ]]></style>
  </defs>
  <rect width="1200" height="820" fill="#fff" stroke-width="1.5"/>
  <text class="title" x="48" y="54">Context Sources and Working Context</text>
  <text class="subtitle" x="48" y="84">The objective is sufficient authorized context — not maximum information.</text>

  <rect x="48" y="150" width="300" height="130" rx="22" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="node-title" x="198" y="192" text-anchor="middle">Systems of Record</text><text class="node-copy" x="76" y="225">Authoritative sources for</text><text class="node-copy" x="76" y="248">defined information classes</text>
  <rect x="450" y="150" width="300" height="130" rx="22" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="node-title" x="600" y="192" text-anchor="middle">Company Memory</text><text class="node-copy" x="478" y="225">Curated durable</text><text class="node-copy" x="478" y="248">Company Artifacts</text>
  <rect x="852" y="150" width="300" height="130" rx="22" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="node-title" x="1002" y="192" text-anchor="middle">Company State</text><text class="node-copy" x="880" y="225">Current operational truth</text><text class="node-copy" x="880" y="248">derived from Evidence</text>

  <path class="flow" fill="none" stroke="#383838" stroke-width="2.7" marker-end="url(#arrow)" d="M198 280 V300 Q198 320 218 320 H460 Q480 320 480 340 V355"/><path class="flow" fill="none" stroke="#383838" stroke-width="2.7" marker-end="url(#arrow)" d="M600 280 V355"/><path class="flow" fill="none" stroke="#383838" stroke-width="2.7" marker-end="url(#arrow)" d="M1002 280 V300 Q1002 320 982 320 H740 Q720 320 720 340 V355"/>

  <rect x="390" y="355" width="420" height="180" rx="24" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="node-title" x="600" y="398" text-anchor="middle">Knowledge Access</text>
  <text class="node-copy" x="418" y="428">Uses authorized inputs where relevant</text><text class="node-copy" x="418" y="451">without changing source authority</text>
  <line x1="418" y1="470" x2="782" y2="470" stroke="#dddddd"/>
  <text class="process" x="470" y="507">Select</text><text class="process" x="555" y="507">Retrieve</text><text class="process" x="650" y="507">Synthesize</text><text class="process" x="752" y="507">Deliver</text>

  <rect x="48" y="380" width="270" height="140" rx="20" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="node-title" x="183" y="416" text-anchor="middle">Pull or Push Access</text><text class="node-copy" x="74" y="445">Current activity (Pull)</text><text class="node-copy" x="74" y="468">Relevant Organizational Event</text><text class="node-copy" x="74" y="491">(Push)</text><path class="flow" fill="none" stroke="#383838" stroke-width="2.7" marker-end="url(#arrow)" d="M318 445 H380"/>
  <rect x="882" y="380" width="270" height="140" rx="20" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="node-title" x="1017" y="416" text-anchor="middle">Governance</text><text class="node-copy" x="908" y="445">Classification · mandates</text><text class="node-copy" x="908" y="468">authorization boundaries</text><path class="constraint" fill="none" stroke="#383838" stroke-width="2.3" stroke-dasharray="5 5" marker-end="url(#constraint)" d="M882 445 H820"/>

  <path class="flow" fill="none" stroke="#383838" stroke-width="2.7" marker-end="url(#arrow)" d="M600 535 V580"/>
  <rect x="390" y="590" width="420" height="150" rx="24" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="node-title" x="600" y="630" text-anchor="middle">Working Context</text><text class="node-copy" x="418" y="660">Smallest sufficient, temporary context</text><text class="node-copy" x="418" y="684">for the authorized activity-specific work</text><text class="node-copy" x="418" y="708">performed by a human or AI system</text>

  <text class="note-title" x="48" y="778" fill="#222222">Company Memory ≠ Company State ≠ Working Context</text>
  <text x="1152" y="804" text-anchor="end" font-size="12" fill="#666666">Knowledge Access prepares context; it does not decide or authorize</text>
</svg>
