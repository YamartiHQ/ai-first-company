<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
  <title id="title">Context Sources and Working Context</title>
  <desc id="desc">Separate governed sources—Company Brain, external information, Performer Memory where permitted, and current Work State—converge through Context Construction. Governance and quality constraints shape construction. The resulting temporary bounded Working Context is delivered to a Performer, may be updated or invalidated by State or Authority change, and is reconstructed at handoff.</desc>
  <metadata><![CDATA[Non-authoritative Derived Representation. Architecture source: ARCHITECTURE.md. Sources are possible governed inputs, not a serial pipeline.]]></metadata>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#383838"/></marker>
    <style><![CDATA[
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#222}.title{font-size:34px;font-weight:700;letter-spacing:-.6px}.subtitle{font-size:19px;fill:#666}.region{fill:#f7f7f7;stroke:#b2b2b2;stroke-width:1.5}.card{fill:#fff;stroke:#b2b2b2;stroke-width:1.5}.focus{fill:#fff;stroke:#555;stroke-width:2}.constraint-card{fill:#f7f7f7;stroke:#b2b2b2;stroke-width:1.5}.kicker{font-size:15px;font-weight:700;letter-spacing:1px}.node-title{font-size:23px;font-weight:700;text-anchor:middle}.node-title-small{font-size:20px;font-weight:700;text-anchor:middle}.copy{font-size:16px;fill:#666;text-anchor:middle}.flow{fill:none;stroke:#383838;stroke-width:2.7;marker-end:url(#arrow)}.constraint{fill:none;stroke:#383838;stroke-width:2.7;marker-end:url(#arrow)}.principle{font-size:18px;font-weight:700;text-anchor:middle}.principle-copy{font-size:16px;fill:#666;text-anchor:middle}
    ]]></style>
  </defs>
  <rect width="1200" height="1100" fill="#fff"/>
  <text class="title" x="48" y="54">Context Sources and Working Context</text>
  <text class="subtitle" x="48" y="84">Separate governed sources converge into the smallest sufficient context for current work</text>

  <text class="kicker" x="48" y="126">POSSIBLE SOURCES — NOT A SERIAL PIPELINE</text>
  <rect class="card" x="48" y="146" width="252" height="124" rx="22"/>
  <text class="node-title" x="174" y="188">Company Brain</text><text class="copy" x="174" y="222">Governed organization-owned</text><text class="copy" x="174" y="246">intelligence</text>
  <rect class="card" x="330" y="146" width="252" height="124" rx="22"/>
  <text class="node-title" x="456" y="188">External Information</text><text class="copy" x="456" y="222">Claims and Evidence</text><text class="copy" x="456" y="246">never organizational Authority</text>
  <rect class="card" x="612" y="146" width="252" height="124" rx="22"/>
  <text class="node-title" x="738" y="188">Performer Memory</text><text class="copy" x="738" y="222">Only where current Memory</text><text class="copy" x="738" y="246">Policy and access permit</text>
  <rect class="card" x="894" y="146" width="252" height="124" rx="22"/>
  <text class="node-title" x="1020" y="188">Current Work State</text><text class="copy" x="1020" y="222">Current case status</text><text class="copy" x="1020" y="246">and Provenance</text>

  <rect class="focus" x="350" y="420" width="500" height="170" rx="24"/>
  <text class="kicker" x="600" y="458" text-anchor="middle">KNOWLEDGE ACCESS PERFORMS THROUGH</text>
  <text class="node-title" x="600" y="502">Context Construction</text>
  <text class="copy" x="600" y="536">Select · retrieve · evaluate · relate</text><text class="copy" x="600" y="562">minimize · deliver</text>
  <path class="flow" d="M174 270 V318 Q174 330 186 330 H428 Q440 330 440 342 V420"/>
  <path class="flow" d="M456 270 V318 Q456 330 468 330 H508 Q520 330 520 342 V420"/>
  <path class="flow" d="M738 270 V318 Q738 330 726 330 H692 Q680 330 680 342 V420"/>
  <path class="flow" d="M1020 270 V318 Q1020 330 1008 330 H772 Q760 330 760 342 V420"/>

  <rect class="constraint-card" x="48" y="438" width="250" height="168" rx="22"/>
  <text class="kicker" x="173" y="474" text-anchor="middle">GOVERNANCE &amp; QUALITY</text>
  <text class="copy" x="173" y="508">Purpose · Scope · Authority</text><text class="copy" x="173" y="532">Classification · Freshness</text><text class="copy" x="173" y="556">Uncertainty · Counter-Evidence</text><text class="copy" x="173" y="580">Applicability · Memory Policy</text>
  <path class="constraint" d="M298 510 H350"/>

  <rect class="card" x="48" y="658" width="280" height="132" rx="22"/>
  <text class="node-title-small" x="188" y="693">State or Authority</text><text class="node-title-small" x="188" y="718">Change</text><text class="copy" x="188" y="750">Update or invalidate</text><text class="copy" x="188" y="774">affected context</text>
  <rect class="focus" x="390" y="646" width="420" height="156" rx="24"/>
  <text class="kicker" x="600" y="684" text-anchor="middle">TEMPORARY · PURPOSE-SPECIFIC · BOUNDED</text>
  <text class="node-title" x="600" y="730">Working Context</text><text class="copy" x="600" y="764">Sufficient for one authorized activity</text>
  <rect class="card" x="872" y="658" width="280" height="132" rx="22"/>
  <text class="node-title" x="1012" y="704">Handoff</text><text class="copy" x="1012" y="740">Reconstruct for the</text><text class="copy" x="1012" y="764">next Performer</text>
  <path class="flow" d="M600 590 V646"/>
  <path class="constraint" d="M328 724 H390"/>
  <path class="constraint" d="M872 724 H810"/>

  <rect class="card" x="450" y="864" width="300" height="104" rx="22"/>
  <text class="node-title" x="600" y="906">Performer</text><text class="copy" x="600" y="940">Receives the current Working Context</text>
  <path class="flow" d="M600 802 V864"/>

  <rect class="region" x="48" y="1008" width="1104" height="64" rx="20"/>
  <text class="principle" x="600" y="1037">Past Access ≠ Current Access · Working Context ≠ Company Brain</text>
  <text class="principle-copy" x="600" y="1061">Handoff reconstructs appropriate context; it does not transfer the predecessor context wholesale.</text>
</svg>
