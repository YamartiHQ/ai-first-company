<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">Three Connected Organizational Loops</title>
  <desc id="desc">The Operating Loop connects Work, Controlled Execution, Outcome, Organizational Events, and Decisions. Outcomes create Experience for the Learning Loop and Production Evidence for the Assurance Loop. Learning proceeds through Reflection, a Learning Candidate, Evidence, and governed Adoption. Assurance proceeds through Continuous Assurance, Operational Confidence, and Authority Review. The loops remain distinct.</desc>
  <metadata><![CDATA[Non-authoritative Derived Representation. Architecture source: ARCHITECTURE.md. Learning does not authorize operation; Assurance does not adopt learning.]]></metadata>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#383838"/></marker>
    <style><![CDATA[
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#222}.title{font-size:34px;font-weight:700;letter-spacing:-.6px}.subtitle{font-size:19px;fill:#666}.region{fill:#f7f7f7;stroke:#b2b2b2;stroke-width:1.5}.card{fill:#fff;stroke:#b2b2b2;stroke-width:1.5}.kicker{font-size:15px;font-weight:700;letter-spacing:1px}.node-title{font-size:23px;font-weight:700;text-anchor:middle}.node-title-small{font-size:19px;font-weight:700;text-anchor:middle}.copy{font-size:16px;fill:#666;text-anchor:middle}.flow{fill:none;stroke:#383838;stroke-width:2.7;marker-end:url(#arrow)}.return{fill:none;stroke:#383838;stroke-width:2.7;marker-end:url(#arrow)}.label{font-size:15px;font-weight:700;fill:#666;text-anchor:middle}.principle{font-size:19px;font-weight:700;text-anchor:middle}.principle-copy{font-size:16px;fill:#666;text-anchor:middle}
    ]]></style>
  </defs>
  <rect width="1200" height="1120" fill="#fff"/>
  <text class="title" x="48" y="54">Three Connected Organizational Loops</text>
  <text class="subtitle" x="48" y="84">Distinct responsibilities connected by Outcomes, Experience, Evidence, Events, and Decisions</text>

  <rect class="region" x="48" y="124" width="1104" height="300" rx="24"/>
  <text class="kicker" x="76" y="162">OPERATING LOOP</text>
  <rect class="card" x="80" y="194" width="280" height="120" rx="22"/>
  <text class="node-title" x="220" y="238">Work</text><text class="copy" x="220" y="274">Bounded organizational need</text>
  <rect class="card" x="460" y="194" width="280" height="120" rx="22"/>
  <text class="node-title" x="600" y="238">Controlled Execution</text><text class="copy" x="600" y="274">Admitted and authorized</text>
  <rect class="card" x="840" y="194" width="280" height="120" rx="22"/>
  <text class="node-title" x="980" y="238">Outcome</text><text class="copy" x="980" y="274">Observed attributable result</text>
  <path class="flow" d="M360 254 H460"/><path class="flow" d="M740 254 H840"/>
  <path class="return" d="M980 314 V338 Q980 350 968 350 H232 Q220 350 220 338 V314"/>
  <text class="label" x="600" y="392">Organizational Events and Decisions shape governed future Work</text>

  <rect class="region" x="48" y="488" width="532" height="430" rx="24"/>
  <text class="kicker" x="314" y="526" text-anchor="middle">LEARNING LOOP</text>
  <rect class="card" x="80" y="554" width="220" height="118" rx="22"/>
  <text class="node-title" x="190" y="598">Experience</text><text class="copy" x="190" y="634">From work and Outcomes</text>
  <rect class="card" x="328" y="554" width="220" height="118" rx="22"/>
  <text class="node-title" x="438" y="598">Reflection</text><text class="copy" x="438" y="634">Governed examination</text>
  <rect class="card" x="80" y="734" width="220" height="118" rx="22"/>
  <text class="node-title-small" x="190" y="778">Learning Candidate</text><text class="copy" x="190" y="814">Evidence + validation</text>
  <rect class="card" x="328" y="734" width="220" height="118" rx="22"/>
  <text class="node-title-small" x="438" y="778">Governed Adoption</text><text class="copy" x="438" y="814">Or no adoption</text>
  <path class="flow" d="M300 613 H328"/>
  <path class="flow" d="M438 672 V694 Q438 706 426 706 H202 Q190 706 190 716 V734"/>
  <path class="flow" d="M300 793 H328"/>

  <rect class="region" x="620" y="488" width="532" height="430" rx="24"/>
  <text class="kicker" x="886" y="526" text-anchor="middle">ASSURANCE LOOP</text>
  <rect class="card" x="648" y="554" width="220" height="118" rx="22"/>
  <text class="node-title-small" x="758" y="598">Production Evidence</text><text class="copy" x="758" y="634">Current operational signals</text>
  <rect class="card" x="896" y="554" width="220" height="118" rx="22"/>
  <text class="node-title-small" x="1006" y="598">Continuous Assurance</text><text class="copy" x="1006" y="634">Is trust still justified?</text>
  <rect class="card" x="648" y="734" width="220" height="118" rx="22"/>
  <text class="node-title-small" x="758" y="778">Operational Confidence</text><text class="copy" x="758" y="814">Current scoped assessment</text>
  <rect class="card" x="896" y="734" width="220" height="118" rx="22"/>
  <text class="node-title" x="1006" y="778">Authority Review</text><text class="copy" x="1006" y="814">Governed response</text>
  <path class="flow" d="M868 613 H896"/>
  <path class="flow" d="M1006 672 V694 Q1006 706 994 706 H770 Q758 706 758 716 V734"/>
  <path class="flow" d="M868 793 H896"/>

  <path class="flow" d="M940 314 V438 Q940 450 928 450 H202 Q190 450 190 468 V554"/>
  <path class="flow" d="M1020 314 V458 Q1020 470 1008 470 H770 Q758 470 758 488 V554"/>

  <rect class="region" x="48" y="968" width="1104" height="112" rx="22"/>
  <text class="principle" x="600" y="1005">Learning does not authorize operation. Assurance does not adopt learning.</text>
  <text class="principle-copy" x="600" y="1037">The loops exchange attributable Outcomes and Evidence without silently performing one another’s responsibilities.</text>
  <text class="principle-copy" x="600" y="1063">Governed future operation reconnects the loops without collapsing them.</text>
</svg>
