<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">AI-First Company Architecture Overview</title>
  <desc id="diagram-desc">A selective overview of the current AI-First Company Architecture. Organizational Identity and the Company Brain orient Company Capabilities realized by Human, AI, and Group Performers. Coordination and Working Context support governed Work, Decisions where required, Controlled Execution, and Outcomes. Outcomes contribute to Organizational Learning and Continuous Assurance. Authority, Accountability, Information Governance, operational integrity, and continuity constrain the whole system.</desc>
  <metadata><![CDATA[
    Diagram status: non-authoritative Derived Representation.
    Architecture source: ARCHITECTURE.md.
    The four cards are explanatory regions, not additional Architecture concepts.
    Organizational Identity orients but does not authorize.
    Evidence and Operational Confidence inform but do not create Authority.
  ]]></metadata>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#383838"/>
    </marker>
    <style><![CDATA[
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#222222}
      .title{font-size:34px;font-weight:700;letter-spacing:-.6px}
      .subtitle{font-size:19px;fill:#666666}
      .boundary-title{font-size:23px;font-weight:700}
      .boundary-copy{font-size:17px;fill:#666666}
      .boundary-meta{font-size:16px;font-weight:650;text-anchor:end}
      .section-label{font-size:16px;font-weight:700;fill:#666666;letter-spacing:1.2px}
      .kicker{font-size:15px;font-weight:700;letter-spacing:1px}
      .card-title{font-size:25px;font-weight:700;letter-spacing:-.25px;text-anchor:middle}
      .card-copy{font-size:17px;fill:#666666}
      .card-item{font-size:17px;font-weight:600}
      .flow-label{font-size:15px;font-weight:700;text-anchor:middle;fill:#666666}
      .principle{font-size:20px;font-weight:700}
      .principle-copy{font-size:16px;fill:#666666}
      .flow{fill:none;stroke:#383838;stroke-width:2.7;marker-end:url(#arrow)}
    ]]></style>
  </defs>

  <rect width="1200" height="1040" fill="#ffffff"/>
  <text class="title" x="48" y="54">AI-First Company Architecture</text>
  <text class="subtitle" x="48" y="84">One coherent organizational system for durable Human–AI operation</text>

  <rect x="48" y="112" width="1104" height="104" rx="22" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="boundary-title" x="74" y="151">Governed organizational boundary</text>
  <text class="boundary-copy" x="74" y="182">Authority and Accountability remain explicit across every operating region.</text>
  <text class="boundary-meta" x="1126" y="151">Authority · Accountability · Information Governance</text>
  <text class="boundary-meta" x="1126" y="182">Operational Integrity · Continuity</text>

  <text class="section-label" x="48" y="256">SELECTIVE ORGANIZATIONAL OPERATING MODEL</text>

  <rect x="48" y="286" width="520" height="210" rx="24" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="kicker" x="76" y="322">ORIENT &amp; REMEMBER</text>
  <text class="card-title" x="308" y="365">Identity &amp; Company Brain</text>
  <text class="card-copy" x="76" y="402">Organizational Identity orients organization-owned intelligence.</text>
  <line x1="76" y1="430" x2="540" y2="430" stroke="#dddddd" stroke-width="1.4"/>
  <text class="card-item" x="76" y="463">Purpose + Principles · Company Brain</text>

  <rect x="632" y="286" width="520" height="210" rx="24" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="kicker" x="660" y="322">REALIZE CAPABILITY</text>
  <text class="card-title" x="892" y="365">Capabilities &amp; Performers</text>
  <text class="card-copy" x="660" y="398">Stable abilities are realized by qualified Human, AI,</text>
  <text class="card-copy" x="660" y="422">and Group Performers.</text>
  <line x1="660" y1="444" x2="1124" y2="444" stroke="#dddddd" stroke-width="1.4"/>
  <text class="card-item" x="660" y="475">Coordination · Working Context</text>

  <rect x="632" y="566" width="520" height="210" rx="24" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="kicker" x="660" y="602">OPERATE WITHIN BOUNDS</text>
  <text class="card-title" x="892" y="645">Governed Operation</text>
  <text class="card-copy" x="660" y="682">Work · Decision where required · Controlled Execution</text>
  <line x1="660" y1="710" x2="1124" y2="710" stroke="#dddddd" stroke-width="1.4"/>
  <text class="card-item" x="660" y="743">Produces an attributable Outcome</text>

  <rect x="48" y="566" width="520" height="210" rx="24" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="kicker" x="76" y="602">LEARN &amp; ASSURE</text>
  <text class="card-title" x="308" y="645">Learning &amp; Confidence</text>
  <text class="card-copy" x="76" y="680">Outcomes support governed Organizational Learning.</text>
  <text class="card-copy" x="76" y="704">Production Evidence supports Continuous Assurance.</text>
  <line x1="76" y1="726" x2="540" y2="726" stroke="#dddddd" stroke-width="1.4"/>
  <text class="card-item" x="76" y="757">Operational Confidence · governed Authority Review</text>

  <path class="flow" d="M568 391 H632"/>
  <path class="flow" d="M892 496 V566"/>
  <path class="flow" d="M632 671 H568"/>
  <path class="flow" d="M308 566 V496"/>
  <text class="flow-label" x="330" y="535" style="text-anchor:start">informs future operation</text>

  <rect x="48" y="826" width="1104" height="132" rx="22" fill="#f7f7f7" stroke="#b2b2b2" stroke-width="1.5"/>
  <text class="principle" x="74" y="865">Identity orients. Authority governs. Evidence informs confidence.</text>
  <text class="principle-copy" x="74" y="897">Decisions occur where required; Controlled Execution keeps organizational effects bounded and attributable.</text>
  <text class="principle-copy" x="74" y="928">Learning and assurance remain distinct, governed paths into deliberate future operation.</text>

</svg>
