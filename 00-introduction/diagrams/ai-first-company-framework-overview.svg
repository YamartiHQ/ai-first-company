<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AI-First Company Framework Overview</title>
  <desc id="desc">An open organizational framework connecting knowledge and state, company capabilities, controlled execution, and outcomes and evidence within human accountability.</desc>
  <metadata><![CDATA[
    Diagram status: non-authoritative Derived Representation.
    Sources: THE-CORE-IDEA.md and ARCHITECTURE.md.
    Understand, Organize, Act, and Learn are explanatory groupings, not additional Architecture concepts.
    Evidence may inform Operational Confidence but never grants authority.
    Authority remains an accountable governance decision.
  ]]></metadata>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#3a3a3a"/>
    </marker>
    <style><![CDATA[
      text {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        fill: #222222;
      }
      .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 2.7px; fill: #686868; }
      .title { font-size: 76px; font-weight: 750; letter-spacing: -2.8px; }
      .copy { font-size: 25px; font-weight: 450; fill: #626262; }
      .footer { font-size: 15px; font-weight: 700; letter-spacing: 1.3px; fill: #555555; }
      .url { font-size: 16px; font-weight: 650; letter-spacing: 0.6px; fill: #333333; }
      .accountability { font-size: 16px; font-weight: 750; letter-spacing: 2px; text-anchor: middle; }
      .card-title { font-size: 18px; font-weight: 750; letter-spacing: 1.2px; text-anchor: middle; }
      .card-copy { font-size: 15px; font-weight: 480; fill: #606060; text-anchor: middle; }
      .principle { font-size: 13px; font-weight: 750; letter-spacing: 1px; fill: #4f4f4f; }
      .flow { fill: none; stroke: #3a3a3a; stroke-width: 2.2; marker-end: url(#arrow); }
    ]]></style>
  </defs>

  <rect width="1280" height="640" fill="#ffffff"/>
  <rect x="28" y="28" width="1224" height="584" rx="28" fill="#fafafa" stroke="#d3d3d3" stroke-width="2"/>

  <g transform="translate(80 92)">
    <text class="eyebrow" x="0" y="0">ONE COHERENT ORGANIZATIONAL SYSTEM</text>
    <text class="title" x="0" y="105">AI-First</text>
    <text class="title" x="0" y="187">Company</text>

    <text class="copy" x="2" y="257">An open, vendor-neutral organizational framework</text>
    <text class="copy" x="2" y="294">for coherent human–AI collaboration.</text>

    <line x1="2" y1="350" x2="590" y2="350" stroke="#d2d2d2" stroke-width="2"/>
    <text class="footer" x="2" y="393">OPENLY LICENSED  ·  CC BY 4.0</text>
    <text class="url" x="2" y="439">github.com/YamartiHQ/ai-first-company</text>
  </g>

  <g transform="translate(723 68)">
    <rect x="0" y="0" width="489" height="504" rx="25" fill="#ffffff"/>
    <path d="M25 1 H464 Q488 1 488 25 V62 H1 V25 Q1 1 25 1 Z" fill="#f2f2f2"/>
    <line x1="1" y1="62" x2="488" y2="62" stroke="#c8c8c8" stroke-width="1.5"/>
    <text class="accountability" x="244.5" y="38">HUMAN ACCOUNTABILITY</text>

    <rect x="24" y="88" width="198" height="112" rx="19" fill="#fafafa" stroke="#b8b8b8" stroke-width="1.6"/>
    <text class="card-title" x="123" y="125">UNDERSTAND</text>
    <line x1="44" y1="143" x2="202" y2="143" stroke="#dddddd" stroke-width="1.4"/>
    <text class="card-copy" x="123" y="170">Knowledge &amp; State</text>

    <rect x="267" y="88" width="198" height="112" rx="19" fill="#fafafa" stroke="#b8b8b8" stroke-width="1.6"/>
    <text class="card-title" x="366" y="125">ORGANIZE</text>
    <line x1="287" y1="143" x2="445" y2="143" stroke="#dddddd" stroke-width="1.4"/>
    <text class="card-copy" x="366" y="170">Company Capabilities</text>

    <rect x="267" y="247" width="198" height="112" rx="19" fill="#fafafa" stroke="#b8b8b8" stroke-width="1.6"/>
    <text class="card-title" x="366" y="284">ACT</text>
    <line x1="287" y1="302" x2="445" y2="302" stroke="#dddddd" stroke-width="1.4"/>
    <text class="card-copy" x="366" y="329">Controlled Execution</text>

    <rect x="24" y="247" width="198" height="112" rx="19" fill="#fafafa" stroke="#b8b8b8" stroke-width="1.6"/>
    <text class="card-title" x="123" y="284">LEARN</text>
    <line x1="44" y1="302" x2="202" y2="302" stroke="#dddddd" stroke-width="1.4"/>
    <text class="card-copy" x="123" y="329">Outcomes &amp; Evidence</text>

    <path class="flow" d="M222 144 H267"/>
    <path class="flow" d="M366 200 V247"/>
    <path class="flow" d="M267 303 H222"/>
    <path class="flow" d="M123 247 V200"/>

    <line x1="24" y1="391" x2="465" y2="391" stroke="#d6d6d6" stroke-width="1.5"/>
    <text class="principle" x="24" y="424">EVIDENCE INFORMS CONFIDENCE</text>
    <text class="principle" x="24" y="457">GOVERNANCE GRANTS AUTHORITY</text>
    <rect x="0" y="0" width="489" height="504" rx="25" fill="none" stroke="#aaaaaa" stroke-width="1.8"/>
  </g>
</svg>
