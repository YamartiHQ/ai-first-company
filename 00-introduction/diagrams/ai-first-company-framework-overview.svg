<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
  <title id="title">AI-First Company at a Glance</title>
  <desc id="desc">A concise overview of the AI-First Company model. Organizational Identity and the Company Brain orient Company Capabilities and qualified Human, AI, and Group Performers. Governed Work proceeds through Decisions where required and Controlled Execution to an Outcome. Outcomes feed distinct Organizational Learning and Continuous Assurance paths. Governed Adoption and Authority responses inform deliberate future operation under Authority, Accountability, Information Governance, Operational Integrity, and Continuity.</desc>
  <metadata><![CDATA[
    Diagram status: non-authoritative Derived Representation.
    Sources: THE-CORE-IDEA.md and ARCHITECTURE.md.
    The visible stages are explanatory groupings, not additional Architecture concepts.
    Organizational Learning and Continuous Assurance remain distinct.
    Evidence and Operational Confidence inform but do not create Authority.
    Responsibility, Authority, and Accountability remain distinct.
  ]]></metadata>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#383838"/>
    </marker>
    <style><![CDATA[
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#252525}
      .title{font-size:42px;font-weight:750;letter-spacing:-1.2px}
      .subtitle{font-size:21px;font-weight:450;fill:#666666}
      .kicker{font-size:17px;font-weight:750;letter-spacing:1.8px;text-anchor:middle}
      .card-title{font-size:29px;font-weight:720;text-anchor:middle}
      .card-copy{font-size:19px;font-weight:450;fill:#626262;text-anchor:middle}
      .operation-title{font-size:18px;font-weight:750;letter-spacing:1.8px;text-anchor:middle}
      .step-title{font-size:22px;font-weight:700;text-anchor:middle}
      .step-copy{font-size:16px;font-weight:450;fill:#666666;text-anchor:middle}
      .future-title{font-size:25px;font-weight:720;text-anchor:middle}
      .future-copy{font-size:17px;font-weight:450;fill:#626262;text-anchor:middle}
      .boundary{font-size:17px;font-weight:700;letter-spacing:.4px;text-anchor:middle;fill:#4f4f4f}
      .region{fill:#f7f7f7;stroke:#b6b6b6;stroke-width:1.8}
      .step{fill:#ffffff;stroke:#b8b8b8;stroke-width:1.6}
      .divider{stroke:#dddddd;stroke-width:1.4}
      .flow{fill:none;stroke:#383838;stroke-width:2.7;marker-end:url(#arrow)}
    ]]></style>
  </defs>

  <rect width="1200" height="1080" fill="#ffffff"/>

  <text class="title" x="60" y="64">AI-First Company at a Glance</text>
  <text class="subtitle" x="60" y="100">One coherent organizational system for durable Human–AI operation</text>

  <rect class="region" x="60" y="145" width="500" height="170" rx="24"/>
  <text class="kicker" x="310" y="184">ORIENT</text>
  <line class="divider" x1="95" y1="202" x2="525" y2="202"/>
  <text class="card-title" x="310" y="244">Identity &amp; Company Brain</text>
  <text class="card-copy" x="310" y="277">Purpose · Principles · organization-owned intelligence</text>

  <rect class="region" x="640" y="145" width="500" height="170" rx="24"/>
  <text class="kicker" x="890" y="184">REALIZE</text>
  <line class="divider" x1="675" y1="202" x2="1105" y2="202"/>
  <text class="card-title" x="890" y="244">Capabilities &amp; Performers</text>
  <text class="card-copy" x="890" y="277">Qualified Human · AI · Group Performers</text>

  <path class="flow" d="M560 230 H640"/>

  <rect class="region" x="60" y="365" width="1080" height="235" rx="24"/>
  <text class="operation-title" x="600" y="405">OPERATE WITHIN BOUNDS</text>

  <rect class="step" x="90" y="438" width="220" height="112" rx="18"/>
  <text class="step-title" x="200" y="486">Work</text>
  <text class="step-copy" x="200" y="519">bounded need</text>

  <rect class="step" x="350" y="438" width="220" height="112" rx="18"/>
  <text class="step-title" x="460" y="477">Decision</text>
  <text class="step-copy" x="460" y="508">where required</text>

  <rect class="step" x="610" y="438" width="240" height="112" rx="18"/>
  <text class="step-title" x="730" y="477">Controlled</text>
  <text class="step-title" x="730" y="505">Execution</text>
  <text class="step-copy" x="730" y="532">admitted and enforced</text>

  <rect class="step" x="890" y="438" width="220" height="112" rx="18"/>
  <text class="step-title" x="1000" y="486">Outcome</text>
  <text class="step-copy" x="1000" y="519">observed result</text>

  <path class="flow" d="M310 494 H350"/>
  <path class="flow" d="M570 494 H610"/>
  <path class="flow" d="M850 494 H890"/>
  <path class="flow" d="M890 315 V330 Q890 340 880 340 H610 Q600 340 600 350 V365"/>

  <rect class="region" x="100" y="675" width="420" height="150" rx="24"/>
  <text class="kicker" x="310" y="714">LEARN</text>
  <line class="divider" x1="135" y1="732" x2="485" y2="732"/>
  <text class="card-title" x="310" y="772">Organizational Learning</text>
  <text class="card-copy" x="310" y="801">Experience → Reflection → governed Adoption</text>

  <rect class="region" x="680" y="675" width="420" height="150" rx="24"/>
  <text class="kicker" x="890" y="714">ASSURE</text>
  <line class="divider" x1="715" y1="732" x2="1065" y2="732"/>
  <text class="card-title" x="890" y="772">Continuous Assurance</text>
  <text class="card-copy" x="890" y="801">Evidence → Confidence → Authority Review</text>

  <path class="flow" d="M970 550 V613 Q970 625 958 625 H322 Q310 625 310 637 V675"/>
  <path class="flow" d="M1030 550 V633 Q1030 645 1018 645 H902 Q890 645 890 657 V675"/>

  <rect class="region" x="240" y="880" width="720" height="95" rx="22"/>
  <text class="future-title" x="600" y="919">Deliberate Future Operation</text>
  <text class="future-copy" x="600" y="949">Adopted learning and governed Authority responses inform what happens next.</text>

  <path class="flow" d="M310 825 V840 Q310 852 322 852 H573 Q585 852 585 864 V880"/>
  <path class="flow" d="M890 825 V840 Q890 852 878 852 H627 Q615 852 615 864 V880"/>

  <rect x="60" y="1010" width="1080" height="50" rx="16" fill="#f7f7f7" stroke="#b6b6b6" stroke-width="1.8"/>
  <text class="boundary" x="600" y="1041">AUTHORITY · ACCOUNTABILITY · INFORMATION GOVERNANCE · OPERATIONAL INTEGRITY · CONTINUITY</text>
</svg>
